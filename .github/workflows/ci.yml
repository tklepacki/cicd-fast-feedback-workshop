name: CI

# Variant: the UI job runs inside a pinned Playwright image.
#
# The reason is reproducibility, not speed.
#
# `npx playwright install` fetches a browser matching the installed @playwright/test, but
# the system libraries, fonts and codecs around it come from `ubuntu-latest` - a label
# GitHub moves underneath you. When the runner image rolls from 22.04 to 24.04 and font
# rendering shifts, the pipeline turns red with no commit to blame. That is the worst kind
# of failure: nobody changed anything, and no retry will fix it, because the cause is
# environment drift rather than test code.
#
# A pinned tag freezes the whole set - browser, OS, fonts, system libraries. The same bytes
# this month and in six months. For visual comparison, where one pixel of font rendering
# decides pass or fail, this is a precondition rather than a convenience.
#
# Running the job in the container also keeps the application under test and the browser
# on the same localhost, which a separate browser server would not.
#
# Whether this is also faster than the 52s the baseline spends installing browsers depends
# on the image pull, and is secondary.
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: UI tests
        run: npm run test:ui

      - name: API tests
        run: npm run test:api

      - name: Unit tests
        run: npm run test:unit

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
