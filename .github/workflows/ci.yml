name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full regression. Cron is UTC and start times are best-effort.
    # This works because a copy made from a template is an ordinary repository:
    # scheduled workflows are disabled in forks.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Zakres testów UI'
        type: choice
        default: smoke
        options: [smoke, regression, all]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Co się zmieniło
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `src/shared/**` appears in both filters on purpose: cart, discount and validation
          # logic is used by the server and the frontend alike, so a change there can break
          # either. A filter that lets a breaking change through is worse than no filter,
          # because it grants false confidence.
          filters: |
            ui:
              - 'src/web/**'
              - 'src/shared/**'
              - 'tests/ui/**'
              - 'playwright.config.ts'
            api:
              - 'src/server/**'
              - 'src/shared/**'
              - 'tests/api/**'
              - 'playwright.config.ts'

  quality:
    name: Lint i typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Testy jednostkowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

      - uses: actions/upload-artifact@v4
        # Without `always()` the report is missing in exactly the case it is needed:
        # when tests failed.
        if: always()
        with:
          name: junit-unit
          path: reports/unit.xml
          retention-days: 1

  security:
    name: Bezpieczeństwo
    runs-on: ubuntu-latest
    # No `needs`: nothing here depends on a build, and a leaked credential is worth knowing
    # about within seconds rather than after the UI suite finishes.
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree. A secret removed in the last
          # commit but present earlier is the common real case, and a shallow clone hides it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      # Two flags carry weight here.
      #
      # --redact: without it the tool that detects leaked secrets prints one into logs
      # that anyone can read on a public repository.
      #
      # --log-opts: gitleaks scans every branch by default. With `fetch-depth: 0` that
      # means a secret committed on any branch fails the scan on all of them - which is
      # arguably correct for a real leak, but useless as a signal about *this* change.
      # Scoping to the current branch answers the question the pipeline is actually asking.
      - name: Secrets in the repository
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts="--first-parent HEAD"

  api-contract:
    name: Kontrakt API
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Two revisions are compared, so the full history has to be present.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Contract from the base branch
        run: |
          git checkout "origin/${{ github.base_ref }}" -- src/server/openapi.ts
          npm run build:server
          node scripts/dump-openapi.mjs /tmp/openapi-base.json
          git checkout HEAD -- src/server/openapi.ts

      - name: Contract from the pull request
        run: |
          npm run build:server
          node scripts/dump-openapi.mjs /tmp/openapi-head.json

      - name: Detect breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: /tmp/openapi-base.json
          revision: /tmp/openapi-head.json
          fail-on: ERR

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # Needed for minutes, not months. The default retention is 90 days.
          retention-days: 1

  test-api:
    name: Testy API
    runs-on: ubuntu-latest
    # Only a build dependency. Adding `needs: quality` would delay the test result by the
    # duration of linting without preventing anything - the merge gate handles that.
    needs: [build, changes]
    if: needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - run: npm run test:api
        env:
          REPORT_NAME: api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-api
          path: reports/api.xml
          retention-days: 1

  test-ui:
    name: UI ${{ github.event_name == 'pull_request' && 2 || 8 }} × ${{ matrix.shard }} (${{ github.event_name == 'pull_request' && 'smoke' || 'regresja' }})
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.ui == 'true'
    container:
      # Pinned on purpose, and the reason is reproducibility rather than speed. A browser
      # cache keys on the Playwright version but not on the operating system, so
      # `ubuntu-latest` still moves underneath it. When the runner image rolls forward and
      # font rendering shifts, the pipeline turns red with no commit to blame - and no
      # retry helps, because the cause is environment drift rather than test code.
      #
      # This is measurably slower than a warm browser cache. That trade is the point.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      # Without this a single failing shard cancels the rest, and their results are
      # exactly what distinguishes one broken test from a broken suite.
      fail-fast: false
      matrix:
        # The shard count follows the event rather than being fixed.
        #
        # A pull request runs the smoke suite - five tests - so four machines would spend
        # more time starting up than testing. Main runs the full regression, where the
        # split pays for itself.
        #
        # `fromJSON` is what makes this possible: a matrix cannot be computed with an
        # expression, but it can be handed a JSON array built by one.
        #
        # Note that a matrix multiplies. Eight shards plus the other jobs is 13 of the
        # 20 concurrent jobs a free account gets - and that limit counts across the whole
        # account, not this repository.
        shard: >-
          ${{ fromJSON(github.event_name == 'pull_request'
              && '[1,2]'
              || '[1,2,3,4,5,6,7,8]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `--only-changed` compares against git history; a shallow clone has none and the
          # flag then quietly matches nothing at all.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A pull request asks one question: did anything obvious break? Five tagged tests
      # answer it in seconds. The full regression belongs on main, where its result gates
      # a release rather than a review.
      - name: UI tests
        run: npx playwright test --project=ui-chromium --shard=${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 2 || 8 }} --grep-invert @flaky ${{ env.GREP }}
        env:
          REPORT_NAME: ui-${{ matrix.shard }}
          GREP: >-
            ${{ (github.event_name == 'pull_request'
                 || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke'))
                && '--grep @smoke'
             || (github.event_name == 'workflow_dispatch' && inputs.suite == 'regression')
                && '--grep-invert @smoke'
             || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # upload-artifact@v4 requires unique names within a run. A shared name makes all
          # four shards collide, and the job then fails on the upload rather than on a test.
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          # Needed for a minute, until the merge job collects them.
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ui-${{ matrix.shard }}
          path: reports/ui-*.xml
          retention-days: 1

      # Traces are the heavy artifact - tens of megabytes each. Uploaded only when the
      # job failed, and kept longer than the rest, because this is what somebody opens
      # days later while working out what went wrong.
      - name: Upload traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  test-ui-quarantine:
    name: Kwarantanna
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.ui == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # Quarantined tests report their result without blocking a merge. The alternatives are
    # a permanently red pipeline everyone learns to ignore, or a deleted test - and a deleted
    # test is a silent loss of coverage. A time limit on quarantine stops it becoming a
    # dumping ground.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # An empty quarantine is the healthy state, and Playwright treats "no tests matched"
      # as an error. Without this flag the job fails precisely when there is nothing wrong.
      - name: Quarantined tests
        run: npx playwright test --project=ui-chromium --grep @flaky --pass-with-no-tests

  ui-report:
    name: Raport UI
    runs-on: ubuntu-latest
    needs: test-ui
    # Must run even when shards failed. A report describing a green run is the one
    # nobody needs to read.
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          # Without this each artifact lands in its own subdirectory and merge-reports
          # sees several separate reports instead of parts of one.
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  test-report:
    name: Raport zbiorczy
    runs-on: ubuntu-latest
    needs: [unit, test-api, test-ui]
    if: always()
    permissions:
      # dorny/test-reporter creates a check run, and this is the first point in the pipeline
      # where `permissions` has a consequence rather than being good hygiene. Note it cannot
      # work for pull requests from forks: their token is read-only.
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # Not the composite action here: this job only runs a dependency-free script,
      # so `npm ci` would be a minute spent on nothing.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Collect JUnit reports
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true

      # A structured check run listing every test - a different thing from the annotations
      # Playwright's `github` reporter puts in the diff, and worth having alongside them.
      - name: Publish check run
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Wyniki testów
          path: reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Job summary
        if: always()
        run: node scripts/ci-summary.mjs reports/*.xml
  publish-report:
    name: Publikacja raportu
    runs-on: ubuntu-latest
    needs: ui-report
    if: always()
    steps:
      # `secrets` is not available in a job-level `if`, so the guard lives in a step.
      # Without it every participant who has not pasted the credentials would see a red job.
      - name: Are the credentials configured
        id: check
        run: |
          if [ -n "${R2_ACCOUNT_ID}" ] && [ -n "${R2_BUCKET}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Brak poświadczeń R2 - pomijam publikację." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Download merged report
        if: steps.check.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      # Plain `aws s3 sync` against an S3-compatible endpoint. That is the point of choosing
      # R2 here: moving this to Azure Blob, S3 or GCS is a change of endpoint and credentials,
      # not a rewrite of the pipeline.
      - name: Upload to R2
        if: steps.check.outputs.ok == 'true'
        run: |
          PREFIX="${{ github.repository_owner }}/run-${{ github.run_number }}"
          aws s3 sync ./playwright-report "s3://${R2_BUCKET}/${PREFIX}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --only-show-errors
          echo "### Raport UI" >> "$GITHUB_STEP_SUMMARY"
          echo "${R2_PUBLIC_URL}/${PREFIX}/index.html" >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
