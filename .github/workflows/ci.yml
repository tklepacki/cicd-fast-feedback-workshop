name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint i typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Testy jednostkowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  security:
    name: Bezpieczeństwo
    runs-on: ubuntu-latest
    # No `needs`: nothing here depends on a build, and a leaked credential is worth knowing
    # about within seconds rather than after the UI suite finishes.
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree. A secret removed in the last
          # commit but present earlier is the common real case, and a shallow clone hides it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      # Two flags carry weight here.
      #
      # --redact: without it the tool that detects leaked secrets prints one into logs
      # that anyone can read on a public repository.
      #
      # --log-opts: gitleaks scans every branch by default. With `fetch-depth: 0` that
      # means a secret committed on any branch fails the scan on all of them - which is
      # arguably correct for a real leak, but useless as a signal about *this* change.
      # Scoping to the current branch answers the question the pipeline is actually asking.
      - name: Secrets in the repository
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts="--first-parent HEAD"

  api-contract:
    name: Kontrakt API
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Two revisions are compared, so the full history has to be present.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Contract from the base branch
        run: |
          git checkout "origin/${{ github.base_ref }}" -- src/server/openapi.ts
          npm run build:server
          node scripts/dump-openapi.mjs /tmp/openapi-base.json
          git checkout HEAD -- src/server/openapi.ts

      - name: Contract from the pull request
        run: |
          npm run build:server
          node scripts/dump-openapi.mjs /tmp/openapi-head.json

      - name: Detect breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: /tmp/openapi-base.json
          revision: /tmp/openapi-head.json
          fail-on: ERR

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # Needed for minutes, not months. The default retention is 90 days.
          retention-days: 1

  test-api:
    name: Testy API
    runs-on: ubuntu-latest
    # Only a build dependency. Adding `needs: quality` would delay the test result by the
    # duration of linting without preventing anything - the merge gate handles that.
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - run: npm run test:api

  test-ui:
    name: Testy UI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - run: npm run test:ui

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
