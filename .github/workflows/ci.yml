name: CI

# MEASUREMENT VARIANT - not the workshop baseline.
#
# Identical to the baseline in every respect but one: the job runs inside the official
# Playwright image, which ships the browsers, so `npx playwright install` is gone.
#
# The question being measured: does pulling a ~2 GB image cost less than the 52 seconds
# the baseline spends installing browsers? Assuming either way would be guessing.
#
# Running the job in the container also removes the networking problem a separate browser
# server would introduce: the application under test and the browser share one localhost.

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: UI tests
        run: npm run test:ui

      - name: API tests
        run: npm run test:api

      - name: Unit tests
        run: npm run test:unit

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
